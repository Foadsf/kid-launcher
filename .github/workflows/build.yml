name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;37.0.0" > /dev/null

      # lintDebug fails the build on any API call newer than minSdk 19.
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug

      - name: minSdk 19, no permissions, v1 signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/aapt2" dump badging "$apk" | grep -x "sdkVersion:'19'"
          perms=$("$bt/aapt2" dump permissions "$apk")
          echo "$perms"
          ! echo "$perms" | grep -q 'uses-permission'
          # Android 4.4 only checks v1 (JAR) signatures.
          "$bt/apksigner" verify -v --min-sdk-version 19 "$apk" | grep "v1 scheme (JAR signing): true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
